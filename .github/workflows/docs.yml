name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Python
        uses: actions/setup-python@fc324d3547104276b827a68afc52ff2a11cc49c9 # v6
        with:
          python-version: "3.14"

      - name: Install Zensical
        run: python -m pip install --disable-pip-version-check "zensical==0.0.68"

      - name: Build documentation
        run: zensical build --clean

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
