name: Sync main to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-gitlab
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch GitHub main and push to GitLab
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_URL: ${{ vars.GITLAB_REPO_URL }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GitHub Actions must provide GITHUB_TOKEN}"
          : "${GITLAB_TOKEN:?Set the GITLAB_TOKEN secret}"
          : "${GITLAB_REPO_URL:?Set the GITLAB_REPO_URL variable}"

          # Accept an HTTPS clone URL without credentials, queries, or fragments.
          if [[ ! "$GITLAB_REPO_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/[a-zA-Z0-9_.-]+)+\.git$ ]]; then
            echo "::error::GITLAB_REPO_URL must be a credential-free HTTPS clone URL ending in .git"
            exit 1
          fi

          export GIT_ASKPASS
          GIT_ASKPASS="$(mktemp)"
          trap 'rm -f "$GIT_ASKPASS"' EXIT

          cat > "$GIT_ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$SYNC_USERNAME" ;;
            *Password*) printf '%s\n' "$SYNC_PASSWORD" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$GIT_ASKPASS"

          # A bare repository fetches all objects without checking out files or
          # inspecting legacy gitlinks that lack .gitmodules configuration.
          repository_dir="$RUNNER_TEMP/gitlab-sync.git"
          git init --bare "$repository_dir"

          export SYNC_USERNAME='x-access-token'
          export SYNC_PASSWORD="$GITHUB_TOKEN"
          git --git-dir="$repository_dir" -c credential.helper= fetch \
            --no-tags --no-recurse-submodules -- \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            refs/heads/main:refs/heads/main

          export SYNC_USERNAME='oauth2'
          export SYNC_PASSWORD="$GITLAB_TOKEN"
          # Fast-forward only: preserve any commits made directly on GitLab.
          git --git-dir="$repository_dir" -c credential.helper= push -- \
            "$GITLAB_REPO_URL" refs/heads/main:refs/heads/main
